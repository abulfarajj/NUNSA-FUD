<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Announcements | NUNSA-FUD Admin</title>
<meta name="description" content="Post and manage NUNSA-FUD announcements."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon.ico" sizes="48x48"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png"/>
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<meta property="og:site_name" content="NUNSA-FUD"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Announcements | NUNSA-FUD Admin"/>
<meta property="og:description" content="Post and manage NUNSA-FUD announcements."/>
<meta property="og:image" content="https://nunsafud.name.ng/assets/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="NUNSA-FUD Electronic Voting System"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="theme-color" content="#f5f4ef">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="redesign.css">
</head><body class="nunsa-page page-admin-announcements">
<header class="admin-header editorial-topbar"><div class="admin-header-left brand-lockup"><img class="association-logo" src="assets/nunsa-logo.png" alt="NUNSA-FUD"><div><h1>NUNSA-FUD</h1><p>Announcement management</p></div></div><a class="logout-button" id="back" href="admin.html">← Dashboard</a></header>
<main class="admin-dashboard">
<section class="page-intro"><h1>Publish an announcement</h1><p class="intro-copy">Post an update, attach an image, or make a branded image from your message.</p></section>
<section class="dashboard-section">
<h2 id="form-title">New announcement</h2>
<form id="form" autocomplete="off" novalidate>
<label for="title">Announcement title</label><input id="title" type="text" maxlength="120" required placeholder="Title">
<label for="author">Name of person making the announcement</label><input id="author" type="text" maxlength="80" required placeholder="Full name">
<label for="author-position">Official position or role</label><input id="author-position" type="text" maxlength="80" required list="roles" placeholder="Position">
<select id="author-select" hidden aria-label="Choose your elected position"></select>
<datalist id="roles"><option value="President"><option value="Vice President"><option value="General Secretary"><option value="Financial Secretary"><option value="Social Director"><option value="Director of Sports"><option value="PRO"><option value="Electoral Committee"><option value="Admin"></datalist>
<label for="text">Announcement message</label><textarea id="text" maxlength="4000" rows="6" placeholder="Message"></textarea>
<label for="mode">Announcement image</label><select id="mode"><option value="none">Text only</option><option value="make">Generate a branded image from this text</option><option value="upload">Upload an image</option></select>
<input id="file" type="file" accept="image/*" hidden>
<div id="preview-wrap" hidden><p class="small-label">IMAGE PREVIEW</p><img id="preview" alt="Announcement image preview" class="announcement-image-preview"></div>
<label id="pin-row" class="checkbox-row"><input id="pinned" type="checkbox"> Pin this announcement</label>
<div class="form-actions"><button class="vote-button" id="save" type="submit">PUBLISH ANNOUNCEMENT</button><button class="secondary-btn" id="cancel" type="button" hidden>Cancel edit</button></div>
<p class="message" id="msg" aria-live="polite"></p>
</form></section>
<section class="dashboard-section"><h2>My announcements</h2><div id="list"></div></section>
</main>
<script type="module" src="admin-announcements.js"></script><script type="module" src="theme.js"></script>
<script src="/loading.js" defer></script>
</body></html>
