<body class="nunsa-page page-admin-management">
<!-- HEADER -->
<header class="admin-header editorial-topbar">
<div class="admin-header-left brand-lockup">
<img alt="NUNSA Logo" class="association-logo" src="assets/nunsa-logo.png"/>
<div>
<h1>NUNSA-FUD</h1>
<p>Admin Management</p>
</div>
</div>
<button class="logout-button" id="back-dashboard-btn" type="button">
            Dashboard
        </button>
</header>
<!-- MAIN CONTENT -->
<main class="admin-dashboard editorial-page layout-admin-management editorial-split"><section class="page-intro" data-motion="rise"><h2 aria-label="Administrators" class="drop-headline">Administrators</h2><p class="intro-copy">Review administrator access and manage invitations.</p></section>
<div class="admin-top"><p class="admin-slots"><strong id="admin-count">0 / 5 Admins</strong><span>Up to 3 can be super admins</span></p><button class="login-button invite-open" id="invite-open-btn" type="button">Invite admin</button></div>
<!-- CURRENT ADMINS -->
<section class="dashboard-section" data-motion="rise">
<h2>Current admins</h2>
<div id="admin-list">
<p>
                    Loading administrators...
                </p>
</div>
</section>
<dialog class="popup" id="invite-dialog" aria-labelledby="invite-title">
<div class="popup-head">
<h2 id="invite-title">Invite administrator</h2>
<button class="popup-close" id="invite-close-btn" type="button" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<form id="invite-admin-form">
<label for="admin-display-name">Name</label>
<input autofocus="" id="admin-display-name" placeholder="Name" required="" type="text"/>
<label for="admin-email">
                        Email
                    </label>
<input id="admin-email" placeholder="Email" required="" type="email"/>
<label for="admin-role">
                        Role
                    </label>
<select id="admin-role" required="">
<option value="">
                            Select role
                        </option>
<option value="admin">
                            Regular Admin
                        </option>
<option value="super_admin">
                            Super Admin
                        </option>
</select>
<button class="login-button" type="submit">Send invitation</button>
<p id="invite-message"></p>
</form>
</dialog>
</main>
<footer>
<p>NUNSA-FUD Electronic Voting System · <a href="/privacy.html">Privacy</a></p>
</footer>
<script src="admin-management.js" type="module"></script>
