<html lang="en">
<head>
<meta charset="utf-8"/>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<meta name="description" content="See the results of a NUNSA-FUD election."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96x96.png"/>
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48x48.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png"/>
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<meta property="og:site_name" content="NUNSA-FUD"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Election results | NUNSA-FUD"/>
<meta property="og:description" content="See the results of a NUNSA-FUD election."/>
<meta property="og:image" content="https://nunsafud.name.ng/assets/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="NUNSA-FUD Electronic Voting System"/>

<link href="style.css" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<link href="redesign.css" rel="stylesheet"/>
</head>
<body class="nunsa-page page-results">
<header class="site-header editorial-topbar"><div class="brand-lockup"><img alt="NUNSA-FUD Logo" class="association-logo" src="assets/nunsa-logo.png"/><div class="brand-copy"><h1>NUNSA-FUD</h1><p>Election Results</p></div></div>



</header>
<main class="page-container editorial-page layout-results results-page"><section class="page-intro" data-motion="rise"><h2 aria-label="Results" class="drop-headline">Results</h2></section>
<section class="card" data-motion="rise" id="results-header-card">
<h2 id="election-title">Election Results</h2>
<p id="election-description"></p>
<div class="status-box" id="election-status">
                Loading election...
            </div>
<div class="results-summary">
<div class="summary-card">
<span>Total Votes</span>
<strong id="total-votes">0</strong>
</div>
<div class="summary-card">
<span>Candidates</span>
<strong id="candidate-count">0</strong>
</div>
</div>
</section>
<section class="card" data-motion="rise">
<h2>Candidate Results</h2>
<div id="results-list">
<p>Loading results...</p>
</div>
</section>
<section class="card" data-motion="rise" id="result-image-section">
<h2>Result image</h2>
<p id="result-image-message">
                The official result image will become available after the election ends.
            </p>
<button id="generate-result-image-btn" style="display:none;" type="button">
                Generate result image
            </button>
<div id="result-image-preview"></div>
<button id="download-result-image-btn" style="display:none;" type="button">
                Download result image 
            </button>
</section>
<section class="card" data-motion="rise">
<button id="back-btn" type="button">
                BACK
            </button>
</section>
</main>
<script src="results.js" type="module"></script>
<script defer="True" src="motion.js"></script><script src="theme.js" type="module"></script>
<script src="student-nav.js" type="module"></script>
<script src="/loading.js" defer></script>
</body>
</html>
