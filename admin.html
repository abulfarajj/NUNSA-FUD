<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="#faf9f5" name="theme-color"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NUNSA-FUD Election Administration</title>
<link href="style.css" rel="stylesheet"/>
</head>
<body class="nunsa-page page-admin">
<header class="admin-header editorial-topbar">
<div class="admin-header-left brand-lockup">
<img alt="NUNSA Logo" class="association-logo" src="assets/nunsa-logo.png"/>
<div>
<h1>NUNSA-FUD</h1>
<p>Election Administration</p>
</div>
</div>
<button class="logout-button" id="logout-btn" type="button">
        Logout
    </button>
</header>
<main class="admin-dashboard editorial-page layout-admin dashboard-page"><section class="page-intro" data-motion="rise"><div class="intro-meta"><p class="eyebrow">ELECTION OPERATIONS</p><span class="intro-rule"></span></div><h2 aria-label="The work behind every vote." class="drop-headline">The work behind every vote.</h2><p class="intro-copy">Manage the election process from one focused workspace.</p></section>
<section class="admin-welcome-card" data-motion="rise">
<p class="small-label">
            ADMINISTRATOR
        </p>
<h2 id="admin-name">
            Loading...
        </h2>
<span class="role-badge" id="admin-role">
            Loading...
        </span>
</section>
<section class="dashboard-section" data-motion="rise">
<h2>
            Election Management
        </h2>
<div class="dashboard-grid">
<button class="dashboard-card" id="elections-btn" type="button"><span class="card-index">01</span>
<h3>
                    Elections
                </h3>
<p>
                    Create and manage elections
                </p>
<span class="card-arrow">↗</span></button>
<button class="dashboard-card" id="candidates-btn" type="button"><span class="card-index">02</span>
<h3>
                    Candidates
                </h3>
<p>
                    Manage election candidates
                </p>
<span class="card-arrow">↗</span></button>
<button class="dashboard-card" id="voters-btn" type="button"><span class="card-index">03</span>
<h3>
                    Voters
                </h3>
<p>
                    Manage eligible voters
                </p>
<span class="card-arrow">↗</span></button>
<button class="dashboard-card" id="results-btn" type="button"><span class="card-index">04</span>
<h3>
                    Results
                </h3>
<p>
                    View live and final election results
                </p>
<span class="card-arrow">↗</span></button>
<button class="dashboard-card" id="students-btn" type="button"><span class="card-index">05</span>
<h3>
                    Students
                </h3>
<p>
                    Manage the general student database
                </p>
<span class="card-arrow">↗</span></button>
</div>
</section>
<section class="dashboard-section" data-motion="rise" id="super-admin-section" style="display: none;">
<h2>
            Super Admin
        </h2>
<button class="dashboard-card" id="admin-management-btn" type="button"><span class="card-index">06</span>
<h3>
                Admin Management
            </h3>
<p>
                Manage administrators and permissions
            </p>
<span class="card-arrow">↗</span></button>
</section>
</main>
<footer>
<p>
        NUNSA-FUD Electronic Voting System
    </p>
</footer>
<script src="admin.js" type="module">
</script>
<script defer="True" src="motion.js"></script></body>
</html>
