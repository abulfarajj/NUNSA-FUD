<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="#faf9f5" media="(prefers-color-scheme: light)" name="theme-color"/><meta content="#0d1517" media="(prefers-color-scheme: dark)" name="theme-color"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NUNSA-FUD Election Administration</title>
<link href="style.css" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<link href="redesign.css" rel="stylesheet"/>
</head>
<body class="nunsa-page page-admin">
<header class="admin-header editorial-topbar">
<div class="admin-header-left brand-lockup">
<img alt="NUNSA Logo" class="association-logo" src="assets/nunsa-logo.png"/>
<div>
<h1>NUNSA-FUD</h1>
<p>Election Administration</p>
</div>
</div>
<button class="logout-button" id="logout-btn" type="button">
        Logout
    </button>
</header>
<main class="admin-dashboard editorial-page layout-admin dashboard-page">
  <section class="page-intro" data-motion="rise">
    </section>
  <section class="admin-welcome-card admin-welcome-line" data-motion="rise">
    <h2 id="admin-name">Loading...</h2>
    <span class="role-badge" id="admin-role">Loading...</span>
  </section>
  <section class="dashboard-section" data-motion="rise">
    <div class="section-heading"><div><h2>Election operations</h2></div></div>
    <div class="dashboard-grid admin-link-list">
      <button class="dashboard-card" id="elections-btn" type="button"><span class="card-index">01</span><span class="admin-link-copy"><h3>Elections</h3></span><span class="card-arrow">↗</span></button>
      <button class="dashboard-card" id="forms-btn" type="button"><span class="card-index">02</span><span class="admin-link-copy"><h3>Applications and screening</h3></span><span class="card-arrow">↗</span></button>
      <button class="dashboard-card" id="candidates-btn" type="button"><span class="card-index">03</span><span class="admin-link-copy"><h3>Candidates</h3></span><span class="card-arrow">↗</span></button>
      <button class="dashboard-card" id="voters-btn" type="button"><span class="card-index">04</span><span class="admin-link-copy"><h3>Voter register</h3></span><span class="card-arrow">↗</span></button>
      <button class="dashboard-card" id="results-btn" type="button"><span class="card-index">05</span><span class="admin-link-copy"><h3>Election results</h3></span><span class="card-arrow">↗</span></button>
    </div>
  </section>
  <section class="dashboard-section" data-motion="rise">
    <div class="section-heading"><div><h2>Students and announcements</h2></div></div>
    <div class="dashboard-grid admin-link-list">
      <button class="dashboard-card" id="students-btn" type="button"><span class="card-index">06</span><span class="admin-link-copy"><h3>Student records</h3></span><span class="card-arrow">↗</span></button>
      <button class="dashboard-card" id="announcements-btn" type="button"><span class="card-index">07</span><span class="admin-link-copy"><h3>Announcements</h3></span><span class="card-arrow">↗</span></button>
    </div>
  </section>
  <section class="dashboard-section" data-motion="rise" id="super-admin-section" style="display:none">
    <div class="section-heading"><div><h2>Super administrator</h2></div></div>
    <div class="dashboard-grid admin-link-list">
      <button class="dashboard-card" id="admin-management-btn" type="button"><span class="card-index">08</span><span class="admin-link-copy"><h3>Administrator management</h3></span><span class="card-arrow">↗</span></button>
    </div>
  </section>
</main>
<script src="admin.js" type="module">
</script>
<script defer="True" src="motion.js"></script>
<script src="theme.js" type="module"></script>
</body>
</html>
