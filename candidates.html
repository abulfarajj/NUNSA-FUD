<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="#faf9f5" media="(prefers-color-scheme: light)" name="theme-color"/><meta content="#0d1517" media="(prefers-color-scheme: dark)" name="theme-color"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manage candidates | NUNSA-FUD Admin</title>
<meta name="description" content="Manage the candidates for a NUNSA-FUD election."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96x96.png"/>
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48x48.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png"/>
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>
<meta property="og:site_name" content="NUNSA-FUD"/>
<meta property="og:type" content="website"/>
<meta property="og:title" content="Manage candidates | NUNSA-FUD Admin"/>
<meta property="og:description" content="Manage the candidates for a NUNSA-FUD election."/>
<meta property="og:image" content="https://nunsafud.name.ng/assets/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="NUNSA-FUD Electronic Voting System"/>
<meta name="twitter:card" content="summary_large_image"/>
<link href="style.css" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<link href="redesign.css" rel="stylesheet"/>
</head>
<body class="nunsa-page page-candidates">
<header class="admin-header editorial-topbar"><div class="admin-header-left brand-lockup"><img alt="NUNSA Logo" class="association-logo" src="assets/nunsa-logo.png"/><div><h1>NUNSA-FUD</h1><p>Candidate Management</p></div></div></header>
<main class="container editorial-page layout-candidates editorial-split"><section class="page-intro" data-motion="rise"><h2 aria-label="Candidates" class="drop-headline">Candidates</h2><p class="intro-copy">Manage candidate details and positions for this election.</p></section>
<button class="back-btn" id="backBtn">
      ← Back to Election
    </button>
<section class="election-info" data-motion="rise">
<h2 id="electionTitle">Loading election...</h2>
<p id="electionDescription"></p>
</section>
<div class="draft-warning hidden" id="draftWarning">
      Candidates can only be added while the election is still in
      <strong>Draft</strong> status.
    </div>
<section class="card" data-motion="rise" id="candidateFormCard">
<h3>Add Candidate</h3>
<div class="field">
<label for="candidateMatric">
          Candidate Matric Number
        </label>
<div class="lookup-row">
<input autocomplete="off" id="candidateMatric" placeholder="Matric number" type="text"/>
<button class="lookup-btn" id="lookupStudentBtn" type="button">
            LOOK UP STUDENT
          </button>
</div>
<div class="student-result" id="studentResult">
<strong>Student Found</strong>
<span id="studentName"></span>
</div>
</div>
<div class="field">
<label for="candidatePosition">
          Position
        </label>
<input autocomplete="off" id="candidatePosition" placeholder="Position" type="text"/>
</div>
<div class="field">
<label for="candidateMandate">Candidate mandate</label>
<textarea id="candidateMandate" maxlength="4000" rows="5" placeholder="Manifesto"></textarea>
</div>
<button class="add-btn" disabled="" id="addCandidateBtn" type="button">
        ADD CANDIDATE
      </button>
<div class="message" id="candidateMessage"></div>
</section>
<section class="card" data-motion="rise">
<h3>Registered Candidates</h3>
<div class="candidate-list" id="candidateList">
<div class="empty">
          Loading candidates...
        </div>
</div>
</section>
</main>
<script src="candidates.js" type="module"></script>
<script defer="True" src="motion.js"></script><script src="theme.js" type="module"></script>
<script src="/loading.js" defer></script>
</body>
</html>
