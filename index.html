    Electronic Voting System    
</p></div></div>    </header> <main class="auth-main"><section class="auth-card" data-motion="rise"><p class="auth-kicker">&bull; Student Login</p>
<h2 id="student-auth-title" class="auth-title">
    Welcome    
</h2>
<p id="student-auth-description" class="auth-sub">Log in or create an account to continue.</p>
<div id="auth-choice">
<button class="auth-btn auth-primary" id="login-btn" type="button">Log in</button>
<button class="auth-btn auth-secondary" id="signup-btn" type="button">Create account</button>
</div>
<form id="login-form" style="display: none;">
<label for="login-matric">Registration number</label>
<div class="field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input autocomplete="off" id="login-matric" placeholder="Registration number" required="" type="text"/></div>
<label class="pin-label">PIN</label>
<div class="pin-input-group" id="login-pin-group">
<input aria-label="PIN digit 1" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="PIN digit 2" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="PIN digit 3" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="PIN digit 4" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
</div>
<button class="auth-link auth-forgot" id="forgot-pin-btn" type="button">Forgot PIN?</button>
<button class="auth-btn auth-primary" id="login-submit-btn" type="submit">Log in</button>
<button class="auth-link" id="back-to-choice-from-login" type="button">Back</button>
<p class="auth-message" id="login-message" role="status"></p>
</form>
<form id="signup-form" style="display: none;">
<label for="signup-matric">Registration number</label>
<div class="field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input autocomplete="off" id="signup-matric" placeholder="Registration number" required="" type="text"/></div>
<label for="signup-email">Email</label>
<div class="field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input autocomplete="email" id="signup-email" placeholder="Email" required="" type="email"/></div>
<div id="signup-code-section" style="display: none;">
<label class="pin-label">Verification code</label>
<div class="pin-input-group code-6" id="signup-code-group">
<input aria-label="Verification code digit 1" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification code digit 2" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification code digit 3" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification code digit 4" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification code digit 5" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Verification code digit 6" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
</div>
</div>
<div id="signup-pin-section" style="display: none;">
<label class="pin-label">Create a 4-digit PIN</label>
<div class="pin-input-group" id="signup-pin-group">
<input aria-label="New PIN digit 1" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="New PIN digit 2" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="New PIN digit 3" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="New PIN digit 4" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
</div>
<label class="pin-label">Confirm PIN</label>
<div class="pin-input-group" id="signup-confirm-pin-group">
<input aria-label="Confirm PIN digit 1" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Confirm PIN digit 2" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Confirm PIN digit 3" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Confirm PIN digit 4" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
</div>
</div>
<button class="auth-btn auth-primary" id="signup-submit-btn" type="submit">Continue</button>
<button class="auth-link" id="back-to-choice-from-signup" type="button">Back</button>
<p class="auth-message" id="signup-message" role="status"></p>
</form>
<form id="forgot-pin-form" style="display: none;">

<div class="field"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input autocomplete="off" id="reset-matric" placeholder="Registration number" required="" type="text"/></div>
<div id="reset-code-section" style="display: none;">
<label class="pin-label">Recovery code</label>
<div class="pin-input-group code-6" id="reset-code-group">
<input aria-label="Recovery code digit 1" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Recovery code digit 2" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Recovery code digit 3" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Recovery code digit 4" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Recovery code digit 5" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Recovery code digit 6" autocomplete="one-time-code" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
</div>
</div>
<div id="reset-pin-section" style="display: none;">
<label class="pin-label">New 4-digit PIN</label>
<div class="pin-input-group" id="reset-pin-group">
<input aria-label="New PIN digit 1" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="New PIN digit 2" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="New PIN digit 3" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="New PIN digit 4" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
</div>
<label class="pin-label">Confirm new PIN</label>
<div class="pin-input-group" id="reset-confirm-pin-group">
<input aria-label="Confirm new PIN digit 1" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Confirm new PIN digit 2" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Confirm new PIN digit 3" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
<input aria-label="Confirm new PIN digit 4" autocomplete="off" class="pin-box" inputmode="numeric" maxlength="1" type="text"/>
</div>
</div>
<button class="auth-btn auth-primary" id="reset-pin-submit-btn" type="submit">Send recovery code</button>
<button class="auth-link" id="back-to-login-from-forgot" type="button">Back to log in</button>
<p class="auth-message" id="reset-pin-message" role="status"></p>
</form>
