<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="#faf9f5" media="(prefers-color-scheme: light)" name="theme-color"/><meta content="#0d1517" media="(prefers-color-scheme: dark)" name="theme-color"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>NUNSA-FUD Admin Login</title>
<link href="style.css" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<link href="redesign.css" rel="stylesheet"/>
</head><body class="nunsa-page page-admin-login"><header class="site-header editorial-topbar"><div class="brand-lockup"><img alt="NUNSA Logo" class="association-logo" src="assets/nunsa-logo.png"/><div class="brand-copy"><h1>NUNSA-FUD</h1><p class="system-title">
        Election Administration
    </p></div></div>



</header>
<main class="container editorial-page layout-admin-login"><section class="page-intro" data-motion="rise"><h2 aria-label="Admin login" class="drop-headline">Admin login</h2></section>
<section class="welcome-card" data-motion="rise">
<h2>Admin Login</h2>
<form id="admin-login-form">
<label for="admin-email">
                Email:
            </label>
<input autocomplete="email" id="admin-email" placeholder="Email" required="" type="email"/>
<label for="admin-password">
                Password:
            </label>
<input autocomplete="current-password" id="admin-password" placeholder="Password" required="" type="password"/>
<button class="vote-button" id="login-button" type="submit">
                LOGIN
            </button>
<p id="login-message"></p>
</form>
</section>
</main>
<script src="admin-login.js" type="module">
</script>
<script defer="True" src="motion.js"></script><script src="theme.js" type="module"></script>
</body>
</html>
