<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="#faf9f5" name="theme-color"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>NUNSA-FUD Admin Login</title>
<link href="style.css" rel="stylesheet"/>
</head><body class="nunsa-page page-admin-login"><header class="site-header editorial-topbar"><div class="brand-lockup"><img alt="NUNSA Logo" class="association-logo" src="assets/nunsa-logo.png"/><div class="brand-copy"><h1>NUNSA-FUD</h1><p class="system-title">
        Election Administration
    </p></div></div>



</header>
<main class="container editorial-page layout-admin-login"><section class="page-intro" data-motion="rise"><div class="intro-meta"><p class="eyebrow">RESTRICTED ACCESS</p><span class="intro-rule"></span></div><h2 aria-label="Administration, made clear." class="drop-headline">Administration, made clear.</h2><p class="intro-copy">Sign in to manage elections, eligibility and official results.</p></section>
<section class="welcome-card" data-motion="rise">
<h2>Admin Login</h2>
<p>
            NUNSA-FUD Election Administration
        </p>
<form id="admin-login-form">
<label for="admin-email">
                Email:
            </label>
<input autocomplete="email" id="admin-email" placeholder="Enter admin email" required="" type="email"/>
<label for="admin-password">
                Password:
            </label>
<input autocomplete="current-password" id="admin-password" placeholder="Enter admin password" required="" type="password"/>
<button class="vote-button" id="login-button" type="submit">
                LOGIN
            </button>
<p id="login-message"></p>
</form>
</section>
</main>
<footer>
<p>
        NUNSA-FUD Electronic Voting System
    </p>
</footer>
<script src="admin-login.js" type="module">
</script>
<script defer="True" src="motion.js"></script></body>
</html>
