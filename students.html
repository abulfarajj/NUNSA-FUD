<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>
        Student Management - NUNSA-FUD
    </title>
<link href="style.css" rel="stylesheet"/>
<link href="theme.css" rel="stylesheet"/>
<link href="redesign.css" rel="stylesheet"/>
</head>
<body class="nunsa-page page-students">
<header class="admin-header editorial-topbar">
<div class="admin-header-left brand-lockup">
<img alt="NUNSA Logo" class="association-logo" src="assets/nunsa-logo.png"/>
<div>
<h1>
                NUNSA-FUD
            </h1>
<p>
                Student Management
            </p>
</div>
</div>
<button class="logout-button" id="back-dashboard-btn" type="button">
        Dashboard
    </button>
</header>
<main class="admin-dashboard editorial-page layout-students editorial-split"><section class="page-intro" data-motion="rise"><h2 aria-label="Students" class="drop-headline">Students</h2></section>
<!-- PAGE INTRO -->
<section class="admin-welcome-card" data-motion="rise">
<h2>
            Student Management
        </h2>
</section>
<!-- ACTIONS -->
<section class="dashboard-section" data-motion="rise">
<h2>
            Student Management
        </h2>
<div class="dashboard-grid">
<button class="dashboard-card" id="add-student-btn" type="button"><span class="card-index">01</span>
<h3>
                    Add Student
                </h3>
<span class="card-arrow">↗</span></button>
<button class="dashboard-card" id="import-students-btn" type="button"><span class="card-index">02</span>
<h3>
                    Import Students
                </h3>
<span class="card-arrow">↗</span></button>
</div>
<a class="section-link" id="student-template-download" href="data:text/csv;charset=utf-8,matricNumber%2Cname%2CacademicLevel%0ABMS%2FNUR%2F24%2F1004%2CAhmad%20Example%2C200%20Level" download="nunsa-student-import-template.csv">Download CSV template ↓</a>
</section>
<!-- SEARCH -->
<section class="dashboard-section" data-motion="rise">
<h2>
            Students
        </h2>
<div class="student-search-container">
<input autocomplete="off" id="student-search" placeholder="Search by name or reg number" type="search"/>
</div>
<div class="student-list" id="student-list">
<p>
                Loading students...
            </p>
</div>
</section>
</main>
<!-- =========================
     IMPORT LIBRARY
========================= -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="students.js" type="module"></script>
<script defer="True" src="motion.js"></script><script src="theme.js" type="module"></script>
</body>
</html>
